syntax = "proto3";

package containerd.systemd.v1;

option go_package = "github.com/cpuguy83/containerd-shim-systemd-v1/options;options";

enum LogMode {
    DEFAULT = 0;
    JOURNALD = 1;
    STDIO = 2;
    NULL = 3;
}

message CreateOptions {
    LogMode log_mode = 1;

    // sd_notify_enable only ever toggled the unit type. Every unit is
    // Type=notify now, and the option never gave the workload the notify
    // socket it implied.
    reserved 2;
    reserved "sd_notify_enable";
}